<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Delphic Systems</title>

    <!-- Tab icon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        font-family: Arial, sans-serif;
        color: white;
      }

      .container {
        text-align: center;
        padding: 40px;
      }

      .logo {
        width: 160px;
        padding: 20px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        margin-bottom: 30px;
      }

      .title {
        font-family: "Times New Roman", Times, serif;
        font-size: 48px;
        margin: 10px 0;
      }

      .subtitle {
        font-size: 18px;
        opacity: 0.85;
        margin-bottom: 40px;
      }

      .coming-soon {
        font-size: 22px;
        letter-spacing: 2px;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="logo.png" alt="Delphic Systems logo" class="logo">

      <div class="title">Delphic Systems</div>

      <div class="subtitle">
        Algorithmic trading through machine learning, uncovering unseen patterns in data
      </div>

      <div class="coming-soon">
        Coming Soon...
      </div>
    </div>
  </body>
</html>
